<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Aaryuda Ayurveda">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d7a3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a5229;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="url(#leafGrad)" />
  <!-- Leaf shape - Ayurvedic leaf icon -->
  <path d="M50 15 C35 20, 20 35, 20 52 C20 68, 32 80, 50 82 C68 80, 80 68, 80 52 C80 35, 65 20, 50 15Z" 
        fill="white" opacity="0.95"/>
  <!-- Central vein -->
  <line x1="50" y1="20" x2="50" y2="78" stroke="#2d7a3e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left veins -->
  <line x1="50" y1="38" x2="32" y2="48" stroke="#2d7a3e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="28" y2="55" stroke="#2d7a3e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="62" x2="34" y2="66" stroke="#2d7a3e" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Right veins -->
  <line x1="50" y1="38" x2="68" y2="48" stroke="#2d7a3e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="72" y2="55" stroke="#2d7a3e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="62" x2="66" y2="66" stroke="#2d7a3e" stroke-width="1.5" stroke-linecap="round"/>
</svg>
